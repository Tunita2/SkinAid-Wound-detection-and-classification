server {
    listen 80;
    listen [::]:80;
    server_name skinaid.xyz;

    # Thư mục chứa file tĩnh (Frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình cache cho các tài nguyên tĩnh
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|json|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        root /usr/share/nginx/html;
    }

    # Reverse Proxy cho API (Backend)
    # HTTPS (Cloudflare) -> HTTP (Nginx) -> HTTP (Backend)
    location /api/ {
        proxy_pass http://skinaid_backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings cho AI service
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Proxy cho uploads (nếu cần truy cập ảnh từ backend)
    # ^~ prefix để override regex matching cho static files
    location ^~ /uploads/ {
        proxy_pass http://skinaid_backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache headers cho ảnh
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}